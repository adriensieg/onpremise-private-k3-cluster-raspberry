<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FFC72C" />
<title>Equipment Inventory - Concept Prototype</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="{{ root_path }}/static/style.css">
</head>
<body>
<div id="header">
  <div class="header-top">
    <span class="location-pill"><i class="ti ti-map-pin"></i> 47th Street</span>
    <button class="bell-btn" aria-label="Notifications"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg></button>
  </div>
  <div class="header-greeting">
    <div>
      <h1 class="greeting-title" id="header-title">Equipment inventory</h1>
      <p class="greeting-sub" id="header-sub"></p>
    </div>
    <div class="avatar">M</div>
  </div>
</div>
<div class="wrap content">
  <div id="app"></div>
</div>
<div id="action-bar"></div>
<div id="toast" class="toast"></div>
<div id="proc" class="proc"><div class="proc-card">
  <div class="scanner">
    <div class="grid"></div><div class="cube"></div>
    <img id="proc-thumb" alt="" style="display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;" />
    <div class="beam"></div>
  </div>
  <p class="proc-title" id="proc-title">Analysing photo</p>
  <p class="proc-sub" id="proc-sub">Looking for equipment...</p>
  <div class="proc-bar"><div class="proc-fill" id="proc-fill"></div></div>
  <p class="proc-count" id="proc-count"></p>
</div></div>
<script>window.ROOT_PATH = "{{ root_path }}";</script>
<script src="{{ root_path }}/static/script.js"></script>
</body>
</html>
