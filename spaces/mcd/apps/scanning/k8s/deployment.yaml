apiVersion: apps/v1
kind: Deployment
metadata:
  name: scanning
  namespace: mcd
  labels:
    app: scanning
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scanning
  template:
    metadata:
      labels:
        app: scanning
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: scanning
          image: ghcr.io/adriensieg/mcd-scanning:0a45d10455680d328097b53302334945d0bf850a
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8000"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini
                  key: GEMINI_API_KEY
            - name: GEMINI_MODEL
              value: "gemini-2.5-flash"
            - name: INVENTORY_PATH
              value: "/data/inventory.txt"
            - name: CAPTURES_DIR
              value: "/data/captures"
            - name: CACHE_DIR
              value: "/data/cache"
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "1000m", memory: "512Mi" }
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}