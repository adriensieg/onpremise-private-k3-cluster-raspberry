<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ app_title }}</title>

  <!-- Base so relative URLs resolve under the /scanning sub-path -->
  <base href="{{ root_path }}/">

  <!-- PWA -->
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="{{ app_title }}">
  <link rel="manifest" href="{{ root_path }}/manifest.json">
  <link rel="apple-touch-icon" href="{{ root_path }}/static/icons/icon-180.png">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ root_path }}/static/style.css">
</head>
<body data-root="{{ root_path }}">
  <div class="app-shell">
    <header class="app-header">
      <h1 class="app-title">{{ app_title }}</h1>
      <span class="badge rounded-pill" id="count">0</span>
    </header>

    <main class="app-main">
      <form id="add-form" class="add-form">
        <input type="text" id="task-input" class="form-control form-control-lg"
               placeholder="Add a task…" autocomplete="off" required>
        <button type="submit" class="btn btn-primary btn-lg" aria-label="Add">
          <i class="bi bi-plus-lg"></i>
        </button>
      </form>

      <ul id="task-list" class="task-list list-unstyled"></ul>

      <p id="empty-state" class="empty-state d-none">
        <i class="bi bi-check2-circle"></i><br>Nothing here yet.
      </p>
    </main>
  </div>

  <!-- Edit modal -->
  <div class="modal fade" id="edit-modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit task</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="text" id="edit-input" class="form-control form-control-lg">
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary" id="edit-save">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- iOS "Add to Home Screen" popup -->
  <div id="ios-install" class="ios-install" hidden>
    <div class="ios-install-card">
      <button class="ios-install-close" id="ios-install-close" aria-label="Close">
        <i class="bi bi-x-lg"></i>
      </button>
      <div class="ios-install-icon">
        <img src="{{ root_path }}/static/icons/icon-192.png" alt="">
      </div>
      <h2 class="ios-install-title">Install {{ app_title }}</h2>
      <p class="ios-install-text">
        Add this app to your Home Screen for the full experience.
      </p>
      <ol class="ios-install-steps">
        <li>Tap the Share button <i class="bi bi-box-arrow-up"></i></li>
        <li>Choose <strong>Add to Home Screen</strong> <i class="bi bi-plus-square"></i></li>
      </ol>
      <div class="ios-install-arrow"><i class="bi bi-chevron-compact-down"></i></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ root_path }}/static/script.js"></script>
</body>
</html>
