apiVersion: apps/v1
kind: Deployment
metadata:
  name: adrien
  namespace: private
  labels:
    app: adrien
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adrien
  template:
    metadata:
      labels:
        app: adrien
    spec:
      containers:
        - name: adrien
          image: ghcr.io/adriensieg/private-adrien:53f86740d00b65e91f8e1cc365b829cf52b3cd6f
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      imagePullSecrets:
        - name: ghcr-secret