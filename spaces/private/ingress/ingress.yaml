apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: private-scanning
  namespace: private
  annotations:
    # Passthrough: forward the full /scanning/... path to the app unchanged.
    # The app is configured with ROOT_PATH=/scanning and serves those paths itself,
    # so NO rewrite-target is used here.
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: private.devailab.work
      http:
        paths:
          - path: /scanning
            pathType: Prefix
            backend:
              service:
                name: scanning
                port:
                  number: 80
