apiVersion: apps/v1
kind: Deployment
metadata:
  name: clotilde
  namespace: public
  labels:
    app: clotilde
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clotilde
  template:
    metadata:
      labels:
        app: clotilde
    spec:
      containers:
        - name: clotilde
          image: ghcr.io/adriensieg/public-clotilde:a1312775ac7e49f473403cf0dbd42cd13bbf543e
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      imagePullSecrets:
        - name: ghcr-secret