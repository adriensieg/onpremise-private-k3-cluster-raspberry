<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Clotilde — Notes</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; }
    input, textarea { width: 100%; padding: 8px; margin: 4px 0; box-sizing: border-box; }
    button { padding: 8px 14px; cursor: pointer; margin-right: 6px; }
    .note { border: 1px solid #ddd; border-radius: 6px; padding: 12px; margin-top: 12px; }
    .note h3 { margin: 0 0 6px; }
  </style>
</head>
<body>
  <h1>Notes</h1>
  <input id="title" placeholder="Title">
  <textarea id="body" placeholder="Body" rows="3"></textarea>
  <button onclick="save()">Save</button>
  <button onclick="clearForm()">Clear</button>
  <div id="list"></div>

  <script>
    const API = "/clotilde/api/notes";
    let editing = null;

    async function load() {
      const notes = await (await fetch(API)).json();
      document.getElementById("list").innerHTML = notes.map(n => `
        <div class="note">
          <h3>${escape(n.title)}</h3>
          <p>${escape(n.body)}</p>
          <button onclick='edit(${n.id}, ${JSON.stringify(n.title)}, ${JSON.stringify(n.body)})'>Edit</button>
          <button onclick="del(${n.id})">Delete</button>
        </div>`).join("");
    }

    function escape(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    async function save() {
      const title = document.getElementById("title").value.trim();
      const body = document.getElementById("body").value.trim();
      if (!title) return;
      const payload = { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ title, body }) };
      let url = API;
      if (editing !== null) { payload.method = "PUT"; url = `${API}/${editing}`; }
      await fetch(url, payload);
      clearForm();
      load();
    }

    function edit(id, title, body) {
      editing = id;
      document.getElementById("title").value = title;
      document.getElementById("body").value = body;
    }

    async function del(id) {
      await fetch(`${API}/${id}`, { method: "DELETE" });
      load();
    }

    function clearForm() {
      editing = null;
      document.getElementById("title").value = "";
      document.getElementById("body").value = "";
    }

    load();
  </script>
</body>
</html>
