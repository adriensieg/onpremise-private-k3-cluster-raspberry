apiVersion: apps/v1
kind: Deployment
metadata:
  name: helloapi
  namespace: public
  labels:
    app: helloapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helloapi
  template:
    metadata:
      labels:
        app: helloapi
    spec:
      containers:
        - name: helloapi
          image: ghcr.io/adriensieg/public-helloapi:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      imagePullSecrets:
        - name: ghcr-secret