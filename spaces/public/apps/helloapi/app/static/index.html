<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hello API</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 80px auto; padding: 0 20px; }
    button { padding: 10px 18px; font-size: 15px; cursor: pointer; }
    pre { background: #f4f4f4; padding: 16px; border-radius: 6px; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Hello API</h1>
  <p>FastAPI running on a Raspberry Pi K3s cluster.</p>
  <button onclick="ping()">Call /api/hello</button>
  <pre id="out">Click the button.</pre>
  <script>
    async function ping() {
      const r = await fetch('api/hello');
      document.getElementById('out').textContent = JSON.stringify(await r.json(), null, 2);
    }
  </script>
</body>
</html>
