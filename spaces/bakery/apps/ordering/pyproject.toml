[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bakery-mcp"
version = "0.1.0"
description = "A ChatGPT Apps SDK bakery storefront served over MCP (Streamable HTTP)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Maison Levain" }]
dependencies = [
    "mcp>=1.13,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "anyio>=4.4,<5",
    "httpx>=0.27,<1",
]

[project.scripts]
bakery-mcp = "run:main"

[tool.setuptools]
# The widget assets (.html/.css/.js) must ship inside the package.
packages = ["app", "app.domain", "app.mcp", "app.widgets"]

[tool.setuptools.package-data]
"app.widgets" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
