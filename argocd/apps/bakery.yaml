apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bakery
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/adriensieg/onpremise-private-k3-cluster-raspberry
    targetRevision: master
    path: spaces/bakery
    directory:
      # Pick up deployment.yaml, service.yaml and ingress.yaml in nested dirs.
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: bakery
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
