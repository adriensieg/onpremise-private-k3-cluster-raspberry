apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mcd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/adriensieg/onpremise-private-k3-cluster-raspberry.git
    targetRevision: master
    path: spaces/mcd
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: mcd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true