apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: public
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/adriensieg/onpremise-private-k3-cluster-raspberry
    targetRevision: main
    path: spaces/public
  destination:
    server: https://kubernetes.default.svc
    namespace: public
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false