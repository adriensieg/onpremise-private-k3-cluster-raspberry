name: Build and deploy

on:
  push:
    branches: [main]
    paths:
      - 'spaces/**/app/**'
      - 'spaces/**/Dockerfile'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build changed-app matrix
        id: build-matrix
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          APPS="[]"
          for WS_DIR in spaces/*/; do
            WS=$(basename "$WS_DIR")
            for APP_DIR in spaces/$WS/apps/*/; do
              [ -d "$APP_DIR" ] || continue
              APP=$(basename "$APP_DIR")
              if echo "$CHANGED" | grep -qE "^spaces/$WS/apps/$APP/(app/|Dockerfile)"; then
                ENTRY="{\"ws\":\"$WS\",\"app\":\"$APP\",\"image\":\"$WS-$APP\"}"
                APPS=$(echo "$APPS" | jq ". + [$ENTRY]")
              fi
            done
          done
          echo "matrix={\"include\":$APPS}" >> $GITHUB_OUTPUT

  build-and-push:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.matrix != '{"include":[]}' }}
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: spaces/${{ matrix.ws }}/apps/${{ matrix.app }}
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/adriensieg/${{ matrix.image }}:latest
            ghcr.io/adriensieg/${{ matrix.image }}:${{ github.sha }}

      - name: Update manifest and commit
        run: |
          M=$(find spaces/${{ matrix.ws }}/apps/${{ matrix.app }}/k8s/ -name "*deployment.yaml" | head -1)
          sed -i "s|image: ghcr.io/adriensieg/${{ matrix.image }}:.*|image: ghcr.io/adriensieg/${{ matrix.image }}:${{ github.sha }}|" "$M"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$M"
          git diff --staged --quiet || git commit -m "ci: ${{ matrix.ws }}/${{ matrix.app }} → ${{ github.sha }}"
          git push